index.html
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資金管理</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    body { margin:0; font-family:-apple-system, system-ui, sans-serif; background:#f6f6f6; }
    .wrap { max-width:700px; margin:0 auto; padding:16px; }
    .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; }
    .label { font-size:13px; color:#666; }
    .big { font-size:28px; font-weight:700; }
    input { width:100%; padding:10px; font-size:16px; margin-top:6px; }
    button { padding:12px; font-size:16px; border:none; border-radius:10px; background:#111; color:#fff; }
    button.light { background:#ddd; color:#111; }
    .row { display:flex; gap:10px; }
    .col { flex:1; }
    table { width:100%; border-collapse:collapse; }
    td, th { padding:6px; font-size:14px; border-bottom:1px solid #eee; }
  </style>
</head>

<body>
<div class="wrap">

  <div class="card">
    <div class="label">全体資金 A</div>
    <div class="big" id="aView">-</div>

    <div class="label">1レース予算 B（8%）</div>
    <div class="big" id="bView">-</div>
  </div>

  <div class="card">
    <div class="label">A を入力</div>
    <div class="row">
      <div class="col">
        <input id="aInput" inputmode="numeric" placeholder="例：100000">
      </div>
      <div class="col">
        <button id="setA">Aをセット</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">結果入力 C</div>
    <div class="row">
      <div class="col">
        <button class="light" id="lose">外れ（0）</button>
      </div>
      <div class="col">
        <input id="cInput" inputmode="numeric" placeholder="的中金額">
      </div>
      <div class="col">
        <button id="hit">確定</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">履歴</div>
    <div id="history"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
